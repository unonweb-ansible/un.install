---
# assert
- name: Assertions for un-install role
  when: un_install_env_src != None
  ansible.builtin.assert:
    that:
    - un_install_env_dst != None

# install
- when: un_install_state == "present"
  block:
  
  # env copy
  - when: un_install_env_src != None
    name: Copy {{ un_install_env_src }}
    become: true
    ansible.builtin.copy:
      src: "{{ role_path }}/files/{{ un_install_app }}/{{ un_install_env_src }}"
      dest: "{{ un_install_dst_path }}/{{ un_install_env_dst }}"
      owner: "{{ un_install_user }}"
      group: "{{ un_install_user }}"
      mode: preserve
      force: "{{ un_install_env_force }}"

  # env template
  - when: un_install_env != None
    become: true
    name: Template .env file to {{ un_install_dst_path }}/{{ un_install_env_dst }}
    ansible.builtin.template:
      src: env.j2
      dest: "{{ un_install_dst_path }}/{{ un_install_env_dst }}"
      mode: u=rw,g=,o=
      force: "{{ un_install_env_force }}"

# remove
- when: un_install_state == "absent"
  block:

  - name: Remove {{ un_install_env_dst }}
    become: true
    ansible.builtin.file:
      path: "{{ un_install_env_dst }}"
      state: absent