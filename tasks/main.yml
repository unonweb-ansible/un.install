---
- name: un-install
  tags:
    - un-install
    - un-install
  vars:
    __un_install_path_icon: "{{ un_install_dst_path }}/{{ un_install_icon }}"
    __un_install_path_exec: "{{ un_install_dst_path }}/{{ un_install_exec }}"
  block:

  # debug
  - when: false
    ansible.builtin.debug:
      msg:
      - "un_install_exec_link: {{ un_install_exec_link }}"
      - "__un_install_path_exec: {{ __un_install_path_exec }}"

  # assert
  - name: Assertions for un-install role
    ansible.builtin.assert:
      that:
      - un_install_app != None
      - un_install_user != None

  # make sure user exists
  - name: Check if user exists {{ un_install_user }}
    command: "getent passwd {{ un_install_user }}"
    changed_when: false

  - ansible.builtin.import_tasks: app.yml
  - ansible.builtin.import_tasks: env.yml
  - ansible.builtin.import_tasks: exec_link.yml
  - ansible.builtin.import_tasks: desktop.yml
  - ansible.builtin.import_tasks: polkit.yml
  - ansible.builtin.import_tasks: systemd.yml